name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: dotnet build PCCare.csproj -c Release -o out
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md out/ -ErrorAction SilentlyContinue
          Compress-Archive -Path out/PCCare.exe,out/PCCare.exe.config -DestinationPath PCCare.zip -ErrorAction SilentlyContinue
          if (!(Test-Path PCCare.zip)) { Compress-Archive -Path out/PCCare.exe -DestinationPath PCCare.zip }
      - uses: actions/upload-artifact@v4
        with:
          name: PCCare
          path: |
            out/PCCare.exe
            PCCare.zip
      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PCCare (latest build)
          files: |
            out/PCCare.exe
            PCCare.zip
